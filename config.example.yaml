# Example configuration for the News_Ag application
# This file can be copied to `config.yaml` and edited as needed.

# Directory where generated output (HTML, images, etc.) will be stored
output_dir: "./site"  # default: relative ./site

# Maximum number of news articles to process per run
max_articles: 10  # default: 10

# List of allowed source domains for credibility whitelist
source_whitelist:
  - "nytimes.com"
  - "theguardian.com"
  - "reuters.com"
  - "apnews.com"

# Whether to fetch royalty‑free images for articles
fetch_images: true  # default: true
# API key for the image source (Unsplash, Pexels, etc.)
# Use an environment variable or secret manager in production
image_source_api_key: "YOUR_API_KEY_HERE"

# Settings for the article generation model
article_generator:
  model: "gpt-4o-mini"  # default model name
  temperature: 0.7  # creativity level (0.0‑1.0)
  max_tokens: 1024

# Path to the HTML template used for static site generation
html_template_path: "templates/base.html"  # default location
